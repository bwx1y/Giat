name: Notion Task Status Sync

on:
  # 1. Triggers saat push commit ke branch fitur (misal: nedy, feature/*)
  push:
    branches-ignore:
      - 'main-backend'
      - 'main-frontend'
  
  # 2. Triggers saat Pull Request di-merge ke main-backend atau main-frontend
  pull_request:
    types: [closed]
    branches:
      - 'main-backend'
      - 'main-frontend'

jobs:
  sync-notion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Sync to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          EVENT_NAME: ${{ github.event_name }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        uses: actions/github-script@v7
        with:
          script: |
            const eventName = process.env.EVENT_NAME;
            const prMerged = process.env.PR_MERGED === 'true';
            
            let targetText = "";
            let targetStatus = "";

            if (eventName === 'push') {
              targetText = process.env.COMMIT_MSG || "";
              targetStatus = "On Progress";
            } else if (eventName === 'pull_request' && prMerged) {
              targetText = process.env.PR_TITLE || "";
              targetStatus = "Done";
            } else {
              console.log("Abaikan event ini.");
              return;
            }

            // Ekstrak ID dari pesan commit/PR (Mencari angka di depan pesan, misal "21 - Update data")
            const match = targetText.match(/^(\d+)\s*[-:]?/);
            if (!match) {
              console.log("Tidak ditemukan ID Task di awal pesan: ", targetText);
              return;
            }

            const taskId = match[1];
            console.log(`Menemukan Task ID: ${taskId}, ubah status ke: ${targetStatus}`);

            // Query ke Notion API
            const response = await fetch(`https://api.notion.com/v1/databases/${process.env.NOTION_DATABASE_ID}/query`, {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${process.env.NOTION_TOKEN}`,
                'Notion-Version': '2022-06-28',
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                filter: {
                  property: 'ID', // Sesuaikan nama kolom ID di database Notion kamu (misal: ID / Number / Name)
                  number: {
                    equals: parseInt(taskId)
                  }
                }
              })
            });

            const data = await response.json();
            if (!data.results || data.results.length === 0) {
              console.log(`Task dengan ID ${taskId} tidak ditemukan di Notion.`);
              return;
            }

            const pageId = data.results[0].id;

            // Update status task di Notion
            await fetch(`https://api.notion.com/v1/pages/${pageId}`, {
              method: 'PATCH',
              headers: {
                'Authorization': `Bearer ${process.env.NOTION_TOKEN}`,
                'Notion-Version': '2022-06-28',
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                properties: {
                  'Status': { // Sesuaikan nama kolom Status di Notion kamu
                    status: {
                      name: targetStatus
                    }
                  }
                }
              })
            });

            console.log(`Berhasil mengubah status task ID ${taskId} menjadi ${targetStatus}`);
