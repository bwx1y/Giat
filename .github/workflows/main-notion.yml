name: Notion Task Status Sync

on:
  # Trigger saat push ke branch mana saja KECUALI main-backend dan main-frontend
  push:
    branches-ignore:
      - 'main-backend'
      - 'main-frontend'

  # Trigger saat PR di-merge ke main-backend atau main-frontend
  pull_request:
    types: [closed]
    branches:
      - 'main-backend'
      - 'main-frontend'

jobs:
  sync-notion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Sync to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          EVENT_NAME: ${{ github.event_name }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        uses: actions/github-script@v7
        with:
          script: |
            const eventName = process.env.EVENT_NAME;
            const prMerged = process.env.PR_MERGED === 'true';
            
            // Bersihkan token & database ID dari spasi / newline
            const rawToken = (process.env.NOTION_TOKEN || "").trim();
            const rawDbId = (process.env.NOTION_DATABASE_ID || "").trim().replace(/[^a-zA-Z0-9]/g, "");

            let targetText = "";
            let targetStatus = "";

            if (eventName === 'push') {
              targetText = process.env.COMMIT_MSG || "";
              targetStatus = "In progress"; // Disesuaikan dengan pilihan di Notion kamu
            } else if (eventName === 'pull_request' && prMerged) {
              targetText = process.env.PR_TITLE || "";
              targetStatus = "Done"; // Disesuaikan dengan pilihan di Notion kamu
            } else {
              console.log("Abaikan event ini.");
              return;
            }

            // Ekstrak ID dari awal pesan (Contoh: "16 - Agregasi Data")
            const match = targetText.match(/^(\d+)\s*[-:]?/);
            if (!match) {
              console.log("Tidak ditemukan ID Task di awal pesan: ", targetText);
              return;
            }

            const taskId = parseInt(match[1]);
            console.log(`Menemukan Task ID: ${taskId}, mencari di Notion Database: ${rawDbId}...`);

            // Query ke Notion API menggunakan filter ID
            const response = await fetch(`https://api.notion.com/v1/databases/${rawDbId}/query`, {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${rawToken}`,
                'Notion-Version': '2022-06-28',
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                filter: {
                  or: [
                    {
                      property: 'ID',
                      unique_id: {
                        equals: taskId
                      }
                    },
                    {
                      property: 'ID',
                      number: {
                        equals: taskId
                      }
                    }
                  ]
                }
              })
            });

            const data = await response.json();

            if (!response.ok) {
              console.log("Error dari Notion API saat query database:", JSON.stringify(data));
              return;
            }

            if (!data.results || data.results.length === 0) {
              console.log(`Task dengan ID ${taskId} tidak ditemukan di Notion.`);
              return;
            }

            const pageId = data.results[0].id;

            // Update status task di Notion
            const updateRes = await fetch(`https://api.notion.com/v1/pages/${pageId}`, {
              method: 'PATCH',
              headers: {
                'Authorization': `Bearer ${rawToken}`,
                'Notion-Version': '2022-06-28',
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                properties: {
                  'Status': {
                    status: {
                      name: targetStatus
                    }
                  }
                }
              })
            });

            const updateData = await updateRes.json();
            if (updateRes.ok) {
              console.log(`Berhasil mengubah status task ID ${taskId} menjadi '${targetStatus}'!`);
            } else {
              console.log(`Gagal meng-update status di Notion:`, JSON.stringify(updateData));
            }