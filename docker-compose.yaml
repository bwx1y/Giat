version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend-giat
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    environment:
      - SERVER_NAME=:8080
      - JWT_SECRET=${JWT_SECRET:-default_secret_key_change_me}
      - DB_HOST=postgres_db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-nama_database_kamu}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASS=${DB_PASS:-password_kamu}
    networks:
      - app_network
    depends_on:
      - postgres_db
    restart: unless-stopped

  postgres_db:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      POSTGRES_DB: ${DB_NAME:-nama_database_kamu}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-password_kamu}
    expose:
      - "5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - app_network
    restart: unless-stopped

networks:
  app_network:
    driver: bridge

volumes:
  pg_data: