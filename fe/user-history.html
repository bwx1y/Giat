<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendify – Riwayat Kehadiran Saya</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app-shell">
    <div id="sidebar-overlay" onclick="closeSidebar()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;"></div>

    <aside id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon"><i class="fa-solid fa-qrcode"></i></div>
        <div>
          <div class="brand-name">Attendify</div>
          <div class="brand-sub">Smart Multi-Event</div>
        </div>
      </div>
      <div class="sidebar-user">
        <div class="avatar" id="sb-avatar">SA</div>
        <div class="user-info">
          <div class="user-name" id="sb-name">Super Admin</div>
          <div class="user-role" id="sb-role">Super Admin</div>
        </div>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav"></nav>

      <div class="sidebar-bottom">
        <div class="nav-item" onclick="doLogout()">
          <i class="fa-solid fa-right-from-bracket"></i>
          <span>Keluar</span>
        </div>
      </div>
    </aside>

    <header id="topbar">
      <button class="topbar-toggle" onclick="toggleSidebar()">
        <i class="fa-solid fa-bars"></i>
      </button>
      <div class="topbar-title" id="topbar-title">Riwayat Kehadiran & Point</div>
      <div class="topbar-actions">
        <div class="role-pill" id="topbar-role-badge">Anggota</div>
        <div class="topbar-btn" onclick="showToast('Tidak ada notifikasi baru', 'info')">
          <i class="fa-solid fa-bell"></i>
          <span class="notif-dot"></span>
        </div>
        <div class="topbar-avatar" id="top-avatar">AP</div>
      </div>
    </header>

    <main id="main-content">
      <div id="page-user-history" class="page" style="display:block;">
        <div class="card">
          <div class="card-header">
            <div>
              <span class="card-title">Riwayat Kehadiran Sub Event Saya</span>
              <div class="card-subtitle">Perolehan point dihitung berdasarkan kehadiran pada masing-masing Sub Event</div>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Event Utama</th>
                  <th>Sub Event</th>
                  <th>Tanggal</th>
                  <th>Status</th>
                  <th>Metode</th>
                  <th>Point</th>
                </tr>
              </thead>
              <tbody id="user-history-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="toast-container"></div>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/attendance.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initLayout('user-history');
      renderUserHistory();
    });
  </script>
</body>
</html>
