services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-giat}
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-secret}
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  db:
    build:
      context: ./docker/postgres
    restart: always
    command: ["postgres", "-c", "shared_preload_libraries=pg_cron", "-c", "cron.database_name=${DB_NAME:-giat}"]
    environment:
      POSTGRES_DB: ${DB_NAME:-giat}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-cron.sh:/docker-entrypoint-initdb.d/init-cron.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-giat}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
